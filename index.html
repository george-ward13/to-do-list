<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do list</title>
        <link href="style.css" rel="stylesheet">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>To-do list</h1>
            <hr>
        </header>
        <main>
            <div class="adding-activities-container">
                <input id="activity-input" type="text" placeholder="Add activity here...">
                <div id="add-button"><h3>Add</h3></div>
            </div>
            <div class="completed-activities-num-container">
                <h3><span id="num-of-completed-activities">0</span> completed activities.</h3>
            </div>
            <div class="all-activities-container">
                <div class="activities-container">
                    <h2>To be completed...</h2>
                </div>
                <div class="completed-activities-container">
                    <h2>Completed:</h2>
                </div>
            </div>
        </main>
    </body>
</html>
