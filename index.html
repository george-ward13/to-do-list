<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>To Do list</title>
        <link href="style.css" rel="stylesheet">
        <script src="script.js" defer></script>
    </head>
    <body>
        <header>
            <h1>To-do list</h1>
            <hr>
        </header>
        <main>
            <div class="adding-activities-container">
                <input id="activity-input" type="text" placeholder="Add activity here...">
                <div id="add-button"><h3>Add</h3></div>
            </div>
            <div class="completed-activities-num-container">
                <h3><span id="num-of-completed-activities">0</span> completed activities.</h3>
            </div>
            <div class="tabs-container">
                <div id="all-tab" class="tab">All activities</div>
                <div id="unfinished-tab" class="tab">To be done</div>
                <div id="completed-tab" class="tab">Completed</div>
            </div>
            <div class="all-activities-container">
                <div class="both-activities-container act-container active">
                    <h3 class="empty-text both-empty-text" id="both-empty-text">Nothing here yet. Get to work! 💪</h3>
                </div>
                <div class="activities-container act-container">
                    <h3 class="empty-text to-be-done-empty-text" id="to-be-done-empty-text">Nothing left to complete. Add more activities! 😁</h3>
                </div>
                <div class="completed-activities-container act-container">
                    <div class="delete-all-completed-btn"><h5>Delete all completed</h5></div>
                    <h3 class="empty-text completed-empty-text" id="completed-empty-text">Nothing here yet. Get to work! 💪</h3>
                </div>
            </div>
        </main>
    </body>
</html>
